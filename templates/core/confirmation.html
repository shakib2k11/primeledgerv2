{% extends "base.html" %}{% load i18n %}{% block title %}{{ title }} {% translate "| Prime Ledger" %}{% endblock %}{% block content %}
<section class="confirmation-page"><span class="overline">{{ eyebrow }}</span><h1>{{ title }}</h1><p>{{ description }}</p><form method="post" class="panel confirmation-card">{% csrf_token %}<label class="confirmation"><input type="checkbox" name="confirm" value="yes" required><span>{{ confirmation_text }}</span></label><div class="form-actions"><a class="button secondary" href="{% if cancel_href %}{{ cancel_href }}{% else %}{% url cancel_url %}{% endif %}">{% translate "Cancel" %}</a><button class="button {% if submit_class %}{{ submit_class }}{% else %}primary{% endif %}" type="submit">{{ submit_label }}</button></div></form></section>
{% endblock %}
