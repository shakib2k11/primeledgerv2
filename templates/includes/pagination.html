{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination"><span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="button tertiary small" href="?page={{ page_obj.previous_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if state %}&state={{ state }}{% endif %}{% if direction %}&direction={{ direction }}{% endif %}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="button tertiary small" href="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}{% if state %}&state={{ state }}{% endif %}{% if direction %}&direction={{ direction }}{% endif %}">Next</a>{% endif %}</div></nav>{% endif %}
